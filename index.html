<style>

</style></head><body>
<h1>💪 Tyler's Training</h1>
<div class="tabs"><button id="tDay" class="on">Day</button><button id="tWeek">Week</button><button id="tSet">Settings</button></div>
<div id="app"></div>
<div id="tm" hidden><div style="display:flex;justify-content:space-between"><div id="tmt"></div><button id="tmx" style="min-height:36px">✕ Close</button></div><div id="tmp"></div><div id="tmd" title="Tap to edit seconds">00:00</div><div class="row"><button class="pri" id="tmpause">Pause</button><button id="tmreset">Reset</button><button id="tmedit">✎ Edit secs</button></div><div class="row" style="align-items:center"><span class="muted">Rest between sets</span><select id="tmrest"><option value="0">None</option><option value="10" selected>10s</option><option value="15">15s</option><option value="30">30s</option><option value="60">60s</option><option value="90">90s</option></select></div></div>
<script>
const KEY='tylerTracker_v1';let S=JSON.parse(localStorage.getItem(KEY)||'{"cleared":false,"log":{}}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const START=new Date(2026,9,14),END=new Date(2027,0,31);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const E=(n,s,r,note)=>({n,s,r,note});
const WRIST='Use wrist wraps/straps whenever the wrist is cranky. Neutral grips only.';
const P1={Mon:{t:'Lower / Hamstring + Core',ex:[E('Isometric bridge hold',5,'30s'),E('Single-leg bridge',3,'10/leg'),E('Slider or stability-ball curl',3,'10'),E('Light RDL (3-sec lower)',3,'8'),E('Goblet squat',3,'10'),E('Step-ups',3,'10/leg'),E('Side lunges',3,'10/side'),E('Slow calf raises',3,'15'),E('Dead bugs',3,'10'),E('Side plank',3,'30s/side'),E('Pallof press',3,'10/side')],notes:['Progress bridges → single-leg → curls only when pain-free.']},
Tue:{t:'Optional Easy Cardio',ex:[E('Pool swim or easy bike',1,'20-30 min'),E('Jump rope',3,'1 min')],notes:['Keep bike resistance low enough that the hamstring stays quiet.']},
Fri:{t:'Full Body (Upper focus)',ex:[E('Landmine press',3,'10'),E('DB neutral-grip bench',3,'10'),E('Chest-supported row',3,'10'),E('Lat pulldown (neutral grip)',3,'10'),E('Push-ups on DB handles',3,'max'),E('Goblet squat',3,'10'),E('Single-leg bridge',3,'10/leg'),E('Pallof press',3,'10/side'),E('Easy bike',1,'10 min')],notes:[WRIST]}};
const P2={Mon:{t:'Lower / Hamstring Armor',ex:[E('Nordic curl (assisted/band)',3,'5'),E('RDL (moderate)',3,'6-8'),E('Trap-bar deadlift',4,'5'),E('Bulgarian split squat',3,'8/leg'),E('Copenhagen plank or side plank',3,'20-30s/side'),E('Calf raises',3,'15')],notes:['Nordics: control the lowering, stop before form breaks.']},
Tue:{t:'Intervals',ex:[E('Bike or rower intervals',8,'30s hard / 90s easy'),E('Jump rope',3,'1 min')],notes:['Return to soccer & skating (cruise first, then park) only once jogging feels normal.']},
Fri:{t:'Full Body + Snowboard Prep',ex:[E('Back squat',4,'5'),E('Landmine press',3,'8'),E('Chest-supported row',3,'8'),E('Lat pulldown',3,'10'),E('Lateral bounds',3,'6/side'),E('Box jumps',3,'5'),E('Wall sit',3,'45s'),E('Single-leg balance',3,'30s/leg'),E('Rotational med-ball throws',3,'8/side')],notes:[WRIST]}};
const WARM=E('Pre-ride warm-up (leg swings, glute bridges, walking lunges, quick skips)',1,'10 min');
const P3={Mon:{t:'Ride Season – Lower',ex:[E('Nordic curl',2,'5'),E('RDL',2,'6'),E('Trap-bar deadlift (heavy)',2,'5'),E('Bulgarian split squat',2,'8/leg'),E('Calf raises',2,'15')],notes:['Lower volume, keep it heavy. Do the 10-min warm-up before every ride.']},
Tue:{t:'Optional Easy Cardio',ex:[E('Pool, bike or rower easy',1,'20-30 min'),E('Jump rope',3,'1 min')],notes:[]},
Fri:{t:'Ride Season – Full Body',ex:[E('Back squat (heavy)',2,'5'),E('RDL',2,'6'),E('Landmine press',2,'8'),E('Chest-supported row',2,'8'),E('Lateral bounds',2,'6/side'),E('Single-leg balance',2,'30s/leg')],notes:[WRIST]}};
const ALT=[E('Easy swim or bike',1,'25-30 min'),E('Isometric bridge hold',5,'30s')];
const REST={t:'Rest / Walk',ex:[E('Walk',1,'20-40 min (optional)')],notes:['Recovery day. Light stretching is fine.']};
const BENCH=['2026-11-07','2026-12-05','2027-01-02'];
function plan(d){const k=ymd(d),dn=DN[d.getDay()];let ph=d<new Date(2026,10,9)?1:d<new Date(2027,0,1)?2:3;const P=[0,P1,P2,P3][ph];let o;
if(k==='2026-10-14')o={t:'Recovery Cardio + Hamstring Rehab',ex:[E('Easy bike',1,'15-20 min'),E('Isometric bridge hold',5,'30s'),E('Dead bugs',3,'10'),E('Side plank',3,'30s/side'),E('Slow calf raises',3,'15'),E('Light jump rope',3,'1 min'),E('Mobility: hips, hamstrings (gentle), T-spine',1,'10 min')],notes:['No soccer this week. No chest/back since you hit them Monday.']};
else if(k==='2026-10-18')o={t:'Easy Swim or Bike',ex:[E('Easy swim or bike',1,'25-30 min'),E('Isometric bridge hold',5,'30s')],notes:['No soccer yet, keep it easy.']};
else if(dn==='Wed'||dn==='Sun')o={t:'Soccer',soccer:true,ex:[E('Soccer',1,'game')],notes:[]};
else if(P[dn])o=JSON.parse(JSON.stringify(P[dn]));else o=JSON.parse(JSON.stringify(REST));
o.notes=o.notes?[...o.notes]:[];
if(dn==='Sat'&&d>=new Date(2026,10,9)&&!o.bench){o={t:'Long Easy Cardio',ex:[E('Long easy cardio (talk-pace)',1,'30-45 min')],notes:['Bike, swim, incline walk or easy jog if cleared. You should be able to hold a conversation.'],ph:ph}}
if(BENCH.includes(k)){o={t:'Monthly Benchmark',bench:true,ex:[E('Warm-up: easy bike/jog',1,'5-10 min'),E('Benchmark: 12-min bike effort OR 1.5-mile run',1,'best steady effort')],notes:['Log distance, time and average heart rate below. Run only if jogging feels normal.'],ph:ph}}
if(ph===3&&(dn==='Sat'||dn==='Sun'))o.notes.push('Ride day? Do the 10-min pre-ride warm-up first.');
if(ph===3&&o.t.startsWith('Ride'))o.ex.unshift(WARM);
if(k==='2026-10-16')o.notes.unshift('🎂 Happy 33rd birthday, Tyler! Go get after it.');
o.ph=ph;return o}
function exList(o){if(o.soccer&&!S.cleared)return ALT;return o.ex}
let cur=new Date();cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());if(cur<START)cur=new Date(START);if(cur>END)cur=new Date(END);
let view='day';const app=document.getElementById('app');
const PH=['','Phase 1 · Heal','Phase 2 · Build','Phase 3 · Ride Season'];
const RULES='<div class="card"><h2>Rules</h2><ul class="muted" style="font-size:14px"><li>Pain max <b>3/10</b> during anything.</li><li>Nothing should still bug you the next morning — if it does, back off.</li><li>See a PT if sitting still hurts after 6 weeks, or anything feels sharp.</li><li>Jump rope 2-3x/week for the calves.</li></ul></div>';
function L(k){return S.log[k]||(S.log[k]={ex:{},notes:'',ham:'',done:false})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderDay(){const k=ymd(cur),o=plan(cur),l=S.log[k]||{ex:{},notes:'',ham:''},isT=k===ymd(new Date());
let h=`<div class="nav card"><button id="pv">◀</button><div style="flex:1;text-align:center"><b>${DN[cur.getDay()]} ${cur.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</b><div class="muted">${isT?'TODAY':''}</div></div><button id="nx">▶</button></div>`;
if(!isT)h+=`<button id="gt" style="width:100%">Jump to Today</button>`;h+=d10html(k);
h+=`<div class="card ${isT?'today':''}"><span class="tag">${PH[o.ph]}</span>${isT?'<span class="tag" style="background:#1d4d3a;color:#7ff0b8">Today</span>':''}<h2 style="margin-top:8px">${o.soccer&&!S.cleared?'Soccer → If not playing: easy swim/bike + hamstring isometrics':o.t}</h2>`;
o.notes.forEach(n=>h+=`<div class="note">${n}</div>`);
if(o.soccer&&!S.cleared)h+=`<div class="note">If not playing: 25-30 min easy swim or bike + hamstring isometrics. (Toggle "Cleared for soccer" in Settings when ready.)</div>`;
exList(o).forEach((e,i)=>{const le=(l.ex||{})[i]||{};h+=`<div class="ex ${le.c?'done':''}"><div class="exh"><div><b>${esc(e.n)}</b><div class="muted">${e.s} × ${esc(e.r)}</div><button class="howb" data-h="${i}">▶ How to</button>${tbtn('m',i,e.n,e.s,e.r)}</div><input type="checkbox" class="chk" data-i="${i}" ${le.c?'checked':''}></div>${(c=>`<div class="how" id="how${i}" hidden>${howInner(e.n,c[1],c[2])}</div>`)(cue(e.n))}<div class="sets"><span class="muted">Set</span><span class="muted">Weight</span><span class="muted">Reps/Time</span>`;
for(let s=0;s<e.s;s++){const v=(le.sets||[])[s]||{};h+=`<span>${s+1}</span><input type="text" inputmode="decimal" data-i="${i}" data-s="${s}" data-f="w" value="${esc(v.w||'')}"><input type="text" inputmode="decimal" data-i="${i}" data-s="${s}" data-f="r" value="${esc(v.r||'')}">`}
h+='</div></div>'});
h+=`</div>${o.bench?benchHTML(k):''}${ringCard()}<div class="card"><b>Hamstring feel: <span id="hv">${l.ham===''||l.ham==null?'–':l.ham}</span>/10</b><div class="muted">0 = perfect, 10 = awful</div><input type="range" min="0" max="10" id="ham" value="${l.ham===''||l.ham==null?0:l.ham}"><b>Notes</b><textarea id="nt" placeholder="How'd it go?">${esc(l.notes||'')}</textarea></div>`+RULES;
app.innerHTML=h;
pv.onclick=()=>{if(add(cur,-1)>=START){cur=add(cur,-1);render()}};nx.onclick=()=>{if(add(cur,1)<=END){cur=add(cur,1);render()}};
if(!isT)gt.onclick=()=>{const t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),t.getDate());if(cur<START)cur=new Date(START);if(cur>END)cur=new Date(END);render()};
app.querySelectorAll('.howb').forEach(b=>b.onclick=()=>{const p=document.getElementById('how'+b.dataset.h);p.hidden=!p.hidden;b.textContent=p.hidden?'▶ How to':'▼ Hide'});app.querySelectorAll('.d10').forEach(c=>c.onchange=()=>{const l=L(k);l.d10=l.d10||{};l.d10[c.dataset.d]=c.checked;save();c.closest('.ex').classList.toggle('done',c.checked);d10c.textContent=Object.values(l.d10).filter(Boolean).length;stk.textContent='🔥 '+streak()+' day streak'});app.querySelectorAll('.chk:not(.d10)').forEach(c=>c.onchange=()=>{const e=L(k).ex[c.dataset.i]||(L(k).ex[c.dataset.i]={});e.c=c.checked;save();c.closest('.ex').classList.toggle('done',c.checked)});
app.querySelectorAll('.sets input').forEach(n=>n.oninput=()=>{const e=L(k).ex[n.dataset.i]||(L(k).ex[n.dataset.i]={});e.sets=e.sets||[];const s=e.sets[n.dataset.s]||(e.sets[n.dataset.s]={});s[n.dataset.f]=n.value;save()});
if(o.bench)['bd','bt','bh'].forEach(id=>{document.getElementById(id).oninput=function(){const b=L(k).bench=L(k).bench||{};b[id]=this.value;save()}});
ham.oninput=()=>{L(k).ham=ham.value;hv.textContent=ham.value;save()};nt.oninput=()=>{L(k).notes=nt.value;save()}}
function renderWeek(){let m=add(cur,-((cur.getDay()+6)%7));let h=`<div class="nav card"><button id="pw">◀</button><div style="flex:1;text-align:center"><b>Week of ${m.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</b></div><button id="nw">▶</button></div><div class="wk">`;
for(let i=0;i<7;i++){const d=add(m,i),k=ymd(d),ok=d>=START&&d<=END,o=ok?plan(d):null,l=S.log[k],c=l&&l.ex&&Object.values(l.ex).some(e=>e.c);
h+=`<div data-k="${ok?k:''}" class="${k===ymd(new Date())?'t':''} ${c?'c':''}"><b>${DN[d.getDay()]}</b><br>${d.getDate()}<br><span class="muted" style="font-size:10px">${o?esc(o.soccer?(S.cleared?'Soccer':'Swim/Bike'):o.t.split(' ')[0]):''}</span></div>`}
h+='</div><p class="muted">Tap a day to open it. Green = something checked off.</p>';
let d=new Date(m);for(let i=0;i<7;i++,d=add(d,1)){if(d<START||d>END)continue;const o=plan(d);h+=`<div class="card"><b>${DN[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</b> — ${esc(o.soccer&&!S.cleared?'Soccer (or easy swim/bike + isometrics)':o.t)}</div>`}
h+=ringCard()+badgesCard();app.innerHTML=h;pw.onclick=()=>{cur=add(cur,-7);if(cur<START)cur=new Date(START);render()};nw.onclick=()=>{cur=add(cur,7);if(cur>END)cur=new Date(END);render()};
app.querySelectorAll('.wk div').forEach(x=>x.onclick=()=>{if(x.dataset.k){cur=parse(x.dataset.k);view='day';render()}})}
function renderSet(){app.innerHTML=`<div class="card"><h2>Settings</h2><label class="sw"><input type="checkbox" id="cl" ${S.cleared?'checked':''}> Cleared for soccer</label><p class="muted">Until checked, Wed/Sun show the swim/bike alternative.</p></div><div class="card"><h2>Backup</h2><div class="row"><button class="pri" id="ex">Export JSON</button><button id="im">Import JSON</button></div><input type="file" id="f" accept=".json,application/json" style="display:none"><p class="muted">Progress is saved on this device (works offline). Export now and then as a backup.</p></div>`+histCard()+badgesCard()+rewardsCard()+RULES+'<div class="card muted" style="font-size:12px">Exercise photos: <a style="color:#7fb0ff" href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">free-exercise-db</a> (Unlicense / public domain). Diagrams drawn for this app.</div>';
cl.onchange=()=>{S.cleared=cl.checked;save()};bindRewards();
ex.onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tyler-training-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove()};
im.onclick=()=>f.click();f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.log)throw 0;S=j;save();alert('Imported!');render()}catch(e){alert('Invalid backup file')}};r.readAsText(f.files[0])}}
const CUES=[

function d10done(k){const l=S.log[k];return !!(l&&l.d10&&D10.every((_,i)=>l.d10[i]))}
function streak(){let d=new Date();d=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(!d10done(ymd(d)))d=add(d,-1);let n=0;while(d10done(ymd(d))){n++;d=add(d,-1)}return n}

for(let i=0;i<9;i++)h+=item(i);
return h+'</div>'}

function benchHTML(k){const b=(S.log[k]||{}).bench||{};return `<div class="card"><h2>📊 Benchmark results</h2><div class="muted">Distance (mi or km)</div><input type="text" inputmode="decimal" id="bd" value="${esc(b.bd||'')}"><div class="muted">Time (mm:ss)</div><input type="text" id="bt" value="${esc(b.bt||'')}"><div class="muted">Avg heart rate (bpm)</div><input type="text" inputmode="numeric" id="bh" value="${esc(b.bh||'')}"></div>`}
function histCard(){const rows=Object.keys(S.log).filter(k=>S.log[k].bench&&(S.log[k].bench.bd||S.log[k].bench.bt||S.log[k].bench.bh)).sort();
return `<div class="card"><h2>📊 Benchmark history</h2>${rows.length?rows.map(k=>{const b=S.log[k].bench;return `<div class="note" style="border-color:#4f8cff;background:#182238"><b>${k}</b>: ${esc(b.bd||'–')} dist · ${esc(b.bt||'–')} · ${esc(b.bh||'–')} bpm</div>`}).join(''):'<p class="muted">Benchmarks: Nov 7, Dec 5, Jan 2. Results show up here.</p>'}</div>`}
function dayDone(k){const l=S.log[k];if(!l||!l.ex)return false;const o=plan(parse(k));const ex=exList(o);return ex.length>0&&ex.every((_,i)=>l.ex[i]&&l.ex[i].c)}
function weekStats(){const t=new Date();let m=add(new Date(t.getFullYear(),t.getMonth(),t.getDate()),-((t.getDay()+6)%7));let pl=0,dn=0;
for(let i=0;i<7;i++){const d=add(m,i);if(d<START||d>END)continue;const o=plan(d);if(o.t==='Rest / Walk')continue;if(o.soccer&&!S.cleared&&false)continue;pl++;if(dayDone(ymd(d)))dn++}return [dn,pl]}
function ringCard(){const[a,b]=weekStats(),f=b?a/b:0,C=2*Math.PI*30;
return `<div class="card" style="display:flex;align-items:center;gap:14px"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="30" stroke="#262c3a" stroke-width="8" fill="none"/><circle cx="38" cy="38" r="30" stroke="#3ecf8e" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 38 38)"/><text x="38" y="43" text-anchor="middle" fill="#e8eaf0" font-size="16" font-weight="700">${a}/${b}</text></svg><div><b>Weekly goal</b><div class="muted">sessions completed vs planned this week${f>=1?' 🎉 Goal hit!':''}</div></div></div>`}
function bestStreak(){const ks=Object.keys(S.log).filter(d10done).sort();let best=0,run=0,prev=null;for(const k of ks){const d=parse(k);run=prev&&ymd(add(prev,1))===k?run+1:1;prev=d;if(run>best)best=run}return Math.max(best,streak())}
function stats(){const ks=Object.keys(S.log);let nordic=false,work=0;
for(const k of ks){const l=S.log[k];if(!l.ex)continue;let o;try{o=plan(parse(k))}catch(e){continue}const ex=exList(o);
if(ex.some((e,i)=>/nordic/i.test(e.n)&&l.ex[i]&&(l.ex[i].c||(l.ex[i].sets||[]).some(x=>x&&(x.w||x.r)))))nordic=true;
if(o.t!=='Rest / Walk'&&!o.soccer&&ex.some((e,i)=>l.ex[i]&&l.ex[i].c))work++}
let pf=false;const hk=ks.filter(k=>S.log[k].ham!==''&&S.log[k].ham!=null).sort();
for(const k of hk){const d=parse(k);let n=0,ok=true;for(let i=0;i<7;i++){const l=S.log[ymd(add(d,i))];if(l&&l.ham!==''&&l.ham!=null){n++;if(+l.ham>2)ok=false}}if(n>=4&&ok){pf=true;break}}
return {best:bestStreak(),nordic,work,pf}}

function tspec(name,s,r){const l=name.toLowerCase();r=String(r||'');let m;

if(m=r.match(/(\d+)\s*s\s*hard\s*\/\s*(\d+)\s*s\s*easy/i))return {iv:1,w:+m[1],r:+m[2],s:+s||1};
if(m=r.match(/(\d+)(?:\s*-\s*(\d+))?\s*(s|min)\b/i)){const w=+m[1]*(m[3].toLowerCase()==='min'?60:1);return {w,s:+s||1,side:/side|leg|each/i.test(r)?1:0}}
return null}

function fmtT(n){n=Math.max(0,n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function beep(long){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=long?3:1;for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=long?988:880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25)}}catch(e){}
try{navigator.vibrate&&navigator.vibrate(long?[300,120,300,120,500]:200)}catch(e){}}
async function wlOn(){try{if(navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
function wlOff(){try{WL&&WL.release()}catch(e){}WL=null}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TM&&TM.running)wlOn()});
function buildSegs(sp){const g=[{t:'ready',secs:3,label:'GET READY'}];
if(sp.iv){for(let i=0;i<sp.s;i++){g.push({t:'work',secs:sp.w,set:i,end:true,label:`HARD ${i+1}/${sp.s}`});if(i<sp.s-1)g.push({t:'rest',secs:sp.r,fixed:1,label:'EASY'})}return g}
for(let i=0;i<sp.s;i++){const lb=`SET ${i+1}/${sp.s}`;
if(sp.side){g.push({t:'work',secs:sp.w,set:i,end:false,label:lb+' · SIDE 1'});g.push({t:'ready',secs:3,label:'SWITCH SIDES'});g.push({t:'work',secs:sp.w,set:i,end:true,label:lb+' · SIDE 2'})}
else g.push({t:'work',secs:sp.w,set:i,end:true,label:sp.s>1?lb:'GO'});
if(i<sp.s-1)g.push({t:'rest',secs:null,label:'REST'})}
return g}
function segSecs(sg){return sg.secs==null?(+$('tmrest').value||0):sg.secs}
function timerClose(){if(TI)clearInterval(TI);TI=null;TM=null;wlOff();$('tm').hidden=true;document.body.style.paddingBottom=''}
function enterSeg(){let sg=TM.segs[TM.idx];while(sg&&segSecs(sg)<=0){TM.idx++;sg=TM.segs[TM.idx]}
if(!sg){return timerDone()}TM.left=segSecs(sg);TM.endAt=Date.now()+TM.left*1000;paintT()}
function paintT(){const sg=TM.segs[TM.idx];$('tmt').textContent=TM.name;const d=$('tmd');d.textContent=TM.done?'DONE ✅':fmtT(TM.left);
$('tmp').textContent=TM.done?'Great work!':(sg?sg.label:'');$('tmp').className=sg&&(sg.t==='rest')?'tmrest':'';$('tmpause').textContent=TM.running?'Pause':(TM.done?'Again':'Resume')}
function timerDone(){TM.done=true;TM.running=false;clearInterval(TI);TI=null;wlOff();beep(true);paintT();markSet(TM.ctx,TM.sp.s-1,true)}
function tickT(){if(!TM||!TM.running)return;const left=Math.ceil((TM.endAt-Date.now())/1000);
if(left>0){if(left!==TM.left){TM.left=left;paintT();if(left<=3&&TM.segs[TM.idx].t!=='ready')try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}return}
const sg=TM.segs[TM.idx];if(sg.t==='work'){beep(false);if(sg.end)markSet(TM.ctx,sg.set,sg.set===TM.sp.s-1)}else beep(false);
TM.idx++;if(TM.idx>=TM.segs.length)return timerDone();enterSeg()}
function openTimer(ctx,name,sp){timerClose();AC=AC||null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}
TM={ctx,name,sp:Object.assign({},sp),segs:buildSegs(sp),idx:0,running:true,done:false,left:0};$('tm').hidden=false;document.body.style.paddingBottom='300px';
enterSeg();TM.running=true;TI=setInterval(tickT,250);wlOn();beep(false)}
function markSet(c,set,last){const dayOpen=view==='day'&&ymd(cur)===c.k;const w=TM&&TM.sp.w||0,val=w>=60&&w%60===0?(w/60)+' min':w+'s';
if(c.kind==='m'){const inp=dayOpen&&app.querySelector(`.sets input[data-i="${c.i}"][data-s="${set}"][data-f="r"]`);
if(inp){if(!inp.value){inp.value=val;inp.oninput()}}else{const e=L(c.k).ex[c.i]||(L(c.k).ex[c.i]={});e.sets=e.sets||[];const x=e.sets[set]||(e.sets[set]={});if(!x.r)x.r=val;save()}
if(last){const b=dayOpen&&app.querySelector(`.chk[data-i="${c.i}"]:not(.d10)`);if(b){b.checked=true;b.onchange()}else{const e=L(c.k).ex[c.i]||(L(c.k).ex[c.i]={});e.c=true;save()}}}
else if(last){const b=dayOpen&&app.querySelector(`.d10[data-d="${c.i}"]`);if(b){b.checked=true;b.onchange()}else{const l=L(c.k);l.d10=l.d10||{};l.d10[c.i]=true;save()}}}
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('.tmb');if(!b)return;openTimer({k:ymd(cur),kind:b.dataset.tk,i:b.dataset.ti},b.dataset.tn,JSON.parse(b.dataset.sp))});
function editSecs(){if(!TM)return;const v=prompt('Seconds per work interval',TM.sp.w);const n=Math.round(+v);if(!v||!(n>0))return;TM.sp.w=n;TM.segs.forEach(g=>{if(g.t==='work')g.secs=n});const sg=TM.segs[TM.idx];if(sg&&sg.t==='work'){TM.left=n;TM.endAt=Date.now()+n*1000}paintT()}
$('tmx').onclick=timerClose;$('tmedit').onclick=editSecs;$('tmd').onclick=editSecs;
$('tmreset').onclick=()=>{if(!TM)return;const c=TM.ctx,n=TM.name,sp=TM.sp;openTimer(c,n,sp);TM.running=false;clearInterval(TI);TI=null;wlOff();TM.idx=0;TM.left=segSecs(TM.segs[0]);paintT()};
$('tmpause').onclick=()=>{if(!TM)return;if(TM.done){const c=TM.ctx,n=TM.name,sp=TM.sp;return openTimer(c,n,sp)}
if(TM.running){TM.running=false;TM.rem=TM.endAt-Date.now();wlOff()}else{TM.running=true;TM.endAt=Date.now()+(TM.rem||TM.left*1000);if(!TI)TI=setInterval(tickT,250);wlOn();AC&&AC.resume&&AC.resume()}paintT()};
function render(){['tDay','tWeek','tSet'].forEach((t,i)=>document.getElementById(t).classList.toggle('on',['day','week','set'][i]===view));view==='day'?renderDay():view==='week'?renderWeek():renderSet();window.scrollTo(0,0)}
tDay.onclick=()=>{view='day';render()};tWeek.onclick=()=>{view='week';render()};tSet.onclick=()=>{view='set';render()};
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.error(e)));
</script></body></html>
